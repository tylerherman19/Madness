name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Database regression tests
        run: npm run test:db

      - name: Operational database and restore regressions
        run: npm run test:operations

      - name: Runtime dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Lint
        run: npx eslint

      - name: Build
        run: npx next build
        env:
          # Placeholders: the build never contacts these — the Supabase client
          # is lazily constructed and only reads env at request time — but the
          # modules expect the vars to be defined.
          SESSION_SECRET: ci-placeholder-secret
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
