name: Encrypted backup and restore drill
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Back up public and sandbox and verify isolated restores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          for schema in public sandbox; do
            SUPABASE_BACKUP_SCHEMA="$schema" node scripts/backup.mjs "work/backup-$schema.json.enc"
            node scripts/restore-check.mjs "work/backup-$schema.json.enc"
          done
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: encrypted-madness-backup-${{ github.run_id }}
          path: |
            work/backup-public.json.enc
            work/backup-sandbox.json.enc
          retention-days: 14
          if-no-files-found: error
      - name: Reverify uploaded archives and record restore observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: node scripts/record-backup-check.mjs
