name: Operations monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madness-operations
  cancel-in-progress: false
jobs:
  worker:
    if: vars.AUTOMATION_V2_ENABLED == 'true' && vars.TOURNAMENT_RELIABILITY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Run durable work without site visitors
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo 'Configure CRON_SECRET before enabling worker'; exit 1; }
          failed=0
          for attempt in 1 2 3 4 5; do
            if ! curl --fail --silent --show-error --max-time 45 -H "Authorization: Bearer $CRON_SECRET" https://madness-cyan.vercel.app/api/cron/worker; then
              failed=1
            fi
            if [ "$attempt" != 5 ]; then sleep 60; fi
          done
          exit "$failed"

  tournament-worker:
    if: vars.AUTOMATION_V2_ENABLED == 'true' && vars.TOURNAMENT_RELIABILITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workload: [schedule, results, grading, assignment, advance, reminders, campaigns, delivery, integrity, retention]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run an independent workload with durable due times
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          failed=0
          for attempt in 1 2 3 4 5; do
            if ! node scripts/worker-request.mjs '${{ matrix.workload }}'; then failed=1; fi
            if [ "$attempt" != 5 ]; then sleep 15; fi
          done
          exit "$failed"
